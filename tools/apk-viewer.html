<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APK / ZIP Viewer</title>
<style>
  :root {
    --bg: #14161f; --panel: #1d2030; --panel2: #252a3d; --line: #333a52;
    --text: #eef1f8; --dim: #9aa3bd; --accent: #f2c94c; --ok: #46c98b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { padding: 16px 16px 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  .pick {
    display: block; background: var(--accent); color: #1a1a22; font-weight: 700;
    text-align: center; padding: 16px; border-radius: 14px; font-size: 16px;
    cursor: pointer; user-select: none;
  }
  .pick:active { transform: scale(.99); }
  .saveall {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    margin-top: 10px; font-size: 15px;
  }
  .saveall:disabled { opacity: .45; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; margin-top: 12px;
    color: var(--dim); font-size: 13px; line-height: 1.4;
  }
  .opt input { width: 22px; height: 22px; flex: 0 0 22px; margin: 0; accent-color: #f2c94c; }
  .bar {
    height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden;
    margin-top: 10px; display: none;
  }
  .bar.on { display: block; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  input[type=file] { display: none; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input[type=search] {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); padding: 12px 14px; border-radius: 12px; font-size: 15px;
  }
  .status { margin: 12px 0 4px; font-size: 13px; color: var(--dim); }
  .status.err { color: #ff8f8f; }
  .status.ok { color: var(--ok); }
  .list { padding: 0 8px 120px; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 12px 10px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .item:active { background: var(--panel2); }
  .ico {
    width: 34px; height: 34px; border-radius: 9px; background: var(--panel2);
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
    color: var(--dim); flex: 0 0 34px; text-transform: uppercase;
  }
  .name { flex: 1; word-break: break-all; font-size: 14px; }
  .meta { color: var(--dim); font-size: 11px; }
  .more {
    display: block; width: calc(100% - 32px); margin: 16px auto;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 14px; border-radius: 12px; font-size: 15px;
  }
  #viewer {
    position: fixed; inset: 0; background: rgba(8, 9, 14, .96); display: none;
    flex-direction: column; z-index: 50;
  }
  #viewer.on { display: flex; }
  .vhead {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .vhead .name { font-size: 13px; }
  .close, .dl {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; font-size: 14px; text-decoration: none;
  }
  .dl { background: var(--accent); color: #1a1a22; font-weight: 700; border: 0; }
  .vbody { flex: 1; overflow: auto; padding: 16px; display: grid; place-items: center; }
  .vbody img { max-width: 100%; height: auto; image-rendering: auto;
               background: repeating-conic-gradient(#2a2f44 0 25%, #22263a 0 50%) 0 0/24px 24px; }
  .vbody pre { width: 100%; text-align: left; white-space: pre-wrap; word-break: break-word;
               font-size: 12px; color: var(--dim); margin: 0; }
  .vbody audio { width: 100%; }
  .hint { color: var(--dim); font-size: 12px; padding: 0 16px 24px; }
</style>
</head>
<body>
<header>
  <h1>APK / ZIP Viewer</h1>
  <div class="sub">Opens an .apk, .zip, .xapk or .apks on your phone. Nothing is uploaded — the file never leaves your device.</div>
  <label class="pick" for="file">Choose file</label>
  <input id="file" type="file" multiple accept=".apk,.zip,.xapk,.apks,.obb,application/vnd.android.package-archive">
  <div class="row"><input id="q" type="search" placeholder="Filter by name, e.g. assets/ or .png"></div>
  <label class="opt"><input type="checkbox" id="onlyassets" checked> Only the files worth studying (images, audio, data, fonts) — much smaller, downloads reliably</label>
  <button class="pick saveall" id="saveall" disabled>Download everything (one .zip file)</button>
  <a class="pick" id="savefinal" style="display:none;margin-top:10px;background:#46c98b"></a>
  <button class="pick" id="saveshare" style="display:none;margin-top:10px;background:#2d9cdb;border:0">Save with Android share sheet</button>
  <div id="status" class="status">No file loaded.</div>
  <div class="bar" id="bar"><i id="barfill"></i></div>
</header>
<div id="list" class="list"></div>
<div class="hint">If your game came as <b>.part00 / .part01</b> files, select both at once — they are joined automatically.</div>

<div id="viewer">
  <div class="vhead">
    <div class="name" id="vname"></div>
    <a class="dl" id="vdl" download>Save</a>
    <button class="close" id="vclose">Close</button>
  </div>
  <div class="vbody" id="vbody"></div>
</div>

<script>
// ===CORE-START===
const u16 = (b, o) => b[o] | (b[o + 1] << 8);
const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
const u64 = (b, o) => u32(b, o) + u32(b, o + 4) * 4294967296;

async function readRange(blob, start, len) {
  if (start < 0 || len < 0) throw new Error("bad range");
  const buf = await blob.slice(start, start + len).arrayBuffer();
  return new Uint8Array(buf);
}

/**
 * Windowed reader. Reading 30 bytes at a time from phone storage costs one
 * storage round-trip per call, which is what made a 3,000-file export crawl.
 * This caches a multi-megabyte window and serves small reads from memory, so a
 * whole archive needs only a few dozen real reads.
 */
function makeReader(blob, windowSize = 4 * 1024 * 1024) {
  let start = -1;
  let buf = null;
  return async function readAt(pos, len) {
    if (buf && pos >= start && pos + len <= start + buf.length) {
      return buf.subarray(pos - start, pos - start + len);
    }
    if (len > windowSize) {
      return readRange(blob, pos, len);
    }
    const end = Math.min(blob.size, pos + windowSize);
    buf = new Uint8Array(await blob.slice(pos, end).arrayBuffer());
    start = pos;
    if (len > buf.length) return readRange(blob, pos, len);
    return buf.subarray(0, len);
  };
}

/** Find and parse the End Of Central Directory record. */
async function readEOCD(blob) {
  const maxTail = Math.min(blob.size, 65557 + 22);
  const tail = await readRange(blob, blob.size - maxTail, maxTail);
  let i = tail.length - 22;
  for (; i >= 0; i--) {
    if (tail[i] === 0x50 && tail[i + 1] === 0x4b && tail[i + 2] === 0x05 && tail[i + 3] === 0x06) break;
  }
  if (i < 0) throw new Error("This file is not a zip/apk archive.");
  const eocd = {
    entries: u16(tail, i + 10),
    cdSize: u32(tail, i + 12),
    cdOffset: u32(tail, i + 16),
    eocdOffsetInTail: i,
    tailStart: blob.size - maxTail,
  };
  // ZIP64: sentinel values mean the real numbers live in the ZIP64 record
  if (eocd.entries === 0xffff || eocd.cdOffset === 0xffffffff) {
    const locOff = eocd.tailStart + i - 20;
    if (locOff >= 0) {
      const loc = await readRange(blob, locOff, 20);
      if (u32(loc, 0) === 0x07064b50) {
        const z64off = u64(loc, 8);
        const z = await readRange(blob, z64off, 56);
        if (u32(z, 0) === 0x06064b50) {
          eocd.entries = u64(z, 32);
          eocd.cdSize = u64(z, 40);
          eocd.cdOffset = u64(z, 48);
        }
      }
    }
  }
  return eocd;
}

/** Parse the central directory into a flat entry list. */
function parseCentralDirectory(cd) {
  const entries = [];
  let p = 0;
  while (p + 46 <= cd.length) {
    if (u32(cd, p) !== 0x02014b50) break;
    const flags = u16(cd, p + 8);
    const method = u16(cd, p + 10);
    const compSize = u32(cd, p + 20);
    const uncompSize = u32(cd, p + 24);
    const nameLen = u16(cd, p + 28);
    const extraLen = u16(cd, p + 30);
    const commentLen = u16(cd, p + 32);
    const offset = u32(cd, p + 42);
    let nameBytes = cd.subarray(p + 46, p + 46 + nameLen);
    let name;
    if (flags & 0x800) {
      name = new TextDecoder("utf-8").decode(nameBytes);
    } else {
      try { name = new TextDecoder("utf-8", { fatal: true }).decode(nameBytes); }
      catch { name = new TextDecoder("windows-1252").decode(nameBytes); }
    }
    entries.push({
      name, method, compSize, uncompSize, offset,
      crc: u32(cd, p + 16),
      dir: name.endsWith("/"),
    });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

/** Load a Blob (or several, joined in order) into an entry list. */
async function openArchive(blob) {
  const eocd = await readEOCD(blob);
  const cd = await readRange(blob, eocd.cdOffset, eocd.cdSize);
  const entries = parseCentralDirectory(cd);
  if (!entries.length) throw new Error("No files found inside this archive.");
  return { blob, entries, eocd };
}

/** Pull one entry's bytes out, decompressing deflate. */
async function extractEntry(archive, entry, inflate) {
  const lh = await readRange(archive.blob, entry.offset, 30);
  if (u32(lh, 0) !== 0x04034b50) throw new Error("Corrupt local header for " + entry.name);
  const nameLen = u16(lh, 26);
  const extraLen = u16(lh, 28);
  const dataStart = entry.offset + 30 + nameLen + extraLen;
  const raw = await readRange(archive.blob, dataStart, entry.compSize);
  if (entry.method === 0) return raw;
  if (entry.method === 8) return await inflate(raw);
  throw new Error("Unsupported compression method " + entry.method);
}

async function joinFiles(files) {
  if (files.length === 1) return files[0];
  const sorted = [...files].sort((a, b) => a.name.localeCompare(b.name));
  return new Blob(sorted);
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function deflateRaw(bytes) {
  const cs = new CompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/**
 * Rebuild every file into a fresh .zip, preserving folder structure.
 *
 * Speed comes from doing no work: the bytes inside an APK are already
 * compressed, so each entry's compressed payload is copied across verbatim
 * with a lazy Blob slice. Nothing is decompressed, nothing is recompressed,
 * and the whole archive never has to sit in memory.
 */
const KEEP_EXT = new Set(["png", "jpg", "jpeg", "webp", "gif", "bmp", "ogg", "mp3", "wav",
  "m4a", "aac", "opus", "json", "xml", "plist", "csv", "txt", "atlas", "fnt", "ttf", "otf",
  "dat", "lvl", "skel", "tmx", "yml", "yaml", "ini", "cfg", "md", "bin"]);
const extOf = (n) => {
  const m = n.match(/\.([a-z0-9]+)$/i);
  return m ? m[1].toLowerCase() : "";
};

async function buildZip(archive, onProgress, onlyAssets = true) {
  const parts = [];
  const central = [];
  const enc = new TextEncoder();
  const files = archive.entries.filter((e) => !e.dir && (!onlyAssets || KEEP_EXT.has(extOf(e.name))));
  const readAt = makeReader(archive.blob);
  let offset = 0;
  let skipped = 0;

  for (let i = 0; i < files.length; i++) {
    const e = files[i];
    let lh;
    try {
      lh = await readAt(e.offset, 30);
    } catch {
      skipped++;
      continue;
    }
    if (u32(lh, 0) !== 0x04034b50) { skipped++; continue; }

    const nameLen = u16(lh, 26);
    const extraLen = u16(lh, 28);
    const dataStart = e.offset + 30 + nameLen + extraLen;
    const nameBytes = enc.encode(e.name);

    const head = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(head.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);          // UTF-8 names
    dv.setUint16(8, e.method, true);        // same method as the source
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x21, true);
    dv.setUint32(14, e.crc >>> 0, true);
    dv.setUint32(18, e.compSize, true);
    dv.setUint32(22, e.uncompSize, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    head.set(nameBytes, 30);

    parts.push(head);
    parts.push(archive.blob.slice(dataStart, dataStart + e.compSize));   // lazy copy
    central.push({ nameBytes, method: e.method, crc: e.crc >>> 0,
                   compSize: e.compSize, uncompSize: e.uncompSize, offset });
    offset += head.length + e.compSize;

    if (onProgress && (i % 25 === 0 || i === files.length - 1)) {
      onProgress(i + 1, files.length, skipped);
    }
    if (i % 250 === 249) await new Promise((r) => setTimeout(r, 0));
  }

  let cdSize = 0;
  const cdParts = [];
  for (const c of central) {
    const b = new Uint8Array(46 + c.nameBytes.length);
    const dv = new DataView(b.buffer);
    dv.setUint32(0, 0x02014b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 20, true);
    dv.setUint16(8, 0x0800, true);
    dv.setUint16(10, c.method, true);
    dv.setUint16(12, 0, true);
    dv.setUint16(14, 0x21, true);
    dv.setUint32(16, c.crc, true);
    dv.setUint32(20, c.compSize, true);
    dv.setUint32(24, c.uncompSize, true);
    dv.setUint16(28, c.nameBytes.length, true);
    dv.setUint16(30, 0, true);
    dv.setUint16(32, 0, true);
    dv.setUint16(34, 0, true);
    dv.setUint16(36, 0, true);
    dv.setUint32(38, 0, true);
    dv.setUint32(42, c.offset, true);
    b.set(c.nameBytes, 46);
    cdParts.push(b);
    cdSize += b.length;
  }

  const eocd = new Uint8Array(22);
  const dv = new DataView(eocd.buffer);
  dv.setUint32(0, 0x06054b50, true);
  dv.setUint16(4, 0, true);
  dv.setUint16(6, 0, true);
  dv.setUint16(8, Math.min(central.length, 0xFFFF), true);
  dv.setUint16(10, Math.min(central.length, 0xFFFF), true);
  dv.setUint32(12, cdSize, true);
  dv.setUint32(16, offset, true);
  dv.setUint16(20, 0, true);

  return new Blob([...parts, ...cdParts, eocd], { type: "application/zip" });
}
// ===CORE-END===

// ---------------- UI ----------------
const $ = (id) => document.getElementById(id);
let ARCHIVE = null;
let LAST_ZIP = null;
let SHOWN = 0;
const PAGE = 300;

const ext = (n) => {
  const m = n.match(/\.([a-z0-9]+)$/i);
  return m ? m[1].toLowerCase() : "";
};
const fmt = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB"
  : n >= 1024 ? (n / 1024).toFixed(1) + " KB" : n + " B";

const IMAGE = ["png", "jpg", "jpeg", "webp", "gif", "bmp"];
const AUDIO = ["ogg", "mp3", "wav", "m4a", "aac", "opus"];
const TEXT = ["txt", "json", "xml", "plist", "csv", "atlas", "fnt", "ini", "cfg", "yaml", "yml", "md"];

function setStatus(msg, cls) {
  const s = $("status");
  s.textContent = msg;
  s.className = "status" + (cls ? " " + cls : "");
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === "undefined") {
    throw new Error("This browser cannot decompress. Use Chrome, Edge or Safari 16.4+.");
  }
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const all = ARCHIVE ? ARCHIVE.entries : [];
  if (!q) return all;
  return all.filter((e) => e.name.toLowerCase().includes(q));
}

function render(reset) {
  const list = $("list");
  const rows = filtered();
  if (reset) { list.innerHTML = ""; SHOWN = 0; }
  const slice = rows.slice(SHOWN, SHOWN + PAGE);
  const frag = document.createDocumentFragment();
  for (const e of slice) {
    const div = document.createElement("div");
    div.className = "item";
    const e1 = ext(e.name);
    const ico = document.createElement("div");
    ico.className = "ico";
    ico.textContent = e.dir ? "DIR" : (e1 || "?");
    const mid = document.createElement("div");
    mid.className = "name";
    mid.textContent = e.name;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = e.dir ? "folder" : fmt(e.uncompSize);
    mid.appendChild(meta);
    div.append(ico, mid);
    if (!e.dir) div.onclick = () => preview(e);
    frag.appendChild(div);
  }
  list.appendChild(frag);
  SHOWN += slice.length;

  let more = $("more");
  if (more) more.remove();
  if (SHOWN < rows.length) {
    const b = document.createElement("button");
    b.id = "more";
    b.className = "more";
    b.textContent = `Show more (${rows.length - SHOWN} left)`;
    b.onclick = () => render(false);
    list.appendChild(b);
  }
}

async function preview(entry) {
  $("vname").textContent = entry.name.split("/").pop();
  const body = $("vbody");
  body.innerHTML = "<div class='hint'>Opening…</div>";
  $("viewer").classList.add("on");
  try {
    const bytes = await extractEntry(ARCHIVE, entry, inflateRaw);
    const e1 = ext(entry.name);
    const mime = IMAGE.includes(e1) ? "image/" + (e1 === "jpg" ? "jpeg" : e1)
      : AUDIO.includes(e1) ? "audio/" + e1
      : "application/octet-stream";
    const blob = new Blob([bytes], { type: mime });
    const url = URL.createObjectURL(blob);
    $("vdl").href = url;
    $("vdl").download = entry.name.split("/").pop();
    body.innerHTML = "";
    if (IMAGE.includes(e1)) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = entry.name;
      body.appendChild(img);
    } else if (AUDIO.includes(e1)) {
      const au = document.createElement("audio");
      au.controls = true;
      au.src = url;
      body.appendChild(au);
    } else if (TEXT.includes(e1)) {
      const pre = document.createElement("pre");
      pre.textContent = new TextDecoder("utf-8", { fatal: false })
        .decode(bytes.subarray(0, 20000));
      body.appendChild(pre);
    } else {
      const d = document.createElement("div");
      d.className = "hint";
      d.textContent = `${fmt(entry.uncompSize)} — no preview for .${e1 || "file"}. Tap Save to download it.`;
      body.appendChild(d);
    }
  } catch (err) {
    body.innerHTML = "";
    const d = document.createElement("div");
    d.className = "hint";
    d.textContent = "Could not open this file: " + err.message;
    body.appendChild(d);
  }
}

$("vclose").onclick = () => $("viewer").classList.remove("on");

$("file").addEventListener("change", async (ev) => {
  const files = [...ev.target.files];
  if (!files.length) return;
  setStatus("Reading " + (files.length > 1 ? files.length + " parts…" : files[0].name + "…"));
  try {
    const blob = await joinFiles(files);
    ARCHIVE = await openArchive(blob);
    const files_ = ARCHIVE.entries.filter((e) => !e.dir).length;
    const total = ARCHIVE.entries.reduce((a, e) => a + e.uncompSize, 0);
    setStatus(`Opened: ${files_} files, ${fmt(total)} uncompressed. Tap “Download everything”.`, "ok");
    render(true);
    $("saveall").disabled = false;               // <- this was the bug: it stayed disabled
    $("saveall").textContent = "Download everything (one .zip file)";
    const fin = $("savefinal");
    fin.style.display = "none";
    fin.removeAttribute("href");
  } catch (err) {
    ARCHIVE = null;
    setStatus(err.message, "err");
    $("list").innerHTML = "";
    $("saveall").disabled = true;
  }
});

$("q").addEventListener("input", () => { if (ARCHIVE) render(true); });

// Fallback path: hand the file to Android's own save sheet, which writes
// straight to Files/Drive and does not depend on Chrome's download manager.
$("saveshare").addEventListener("click", async () => {
  if (!LAST_ZIP) return;
  try {
    const file = new File([LAST_ZIP], "extracted-files.zip", { type: "application/zip" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Extracted files" });
      setStatus("Shared — choose Files or Drive to save it.", "ok");
    } else {
      setStatus("This browser cannot share files. Use the green button instead.", "err");
    }
  } catch (err) {
    setStatus("Share cancelled or failed: " + err.message, "err");
  }
});

$("saveall").addEventListener("click", async () => {
  if (!ARCHIVE) return;
  const btn = $("saveall");
  const bar = $("bar");
  const fill = $("barfill");
  const onlyAssets = $("onlyassets").checked;
  const chosen = ARCHIVE.entries.filter((e) => !e.dir &&
    (!onlyAssets || KEEP_EXT.has(extOf(e.name))));
  const totalBytes = chosen.reduce((a, e) => a + e.uncompSize, 0);
  const count = chosen.length;
  btn.disabled = true;
  btn.textContent = "Packing… please wait";
  bar.classList.add("on");
  fill.style.width = "0%";
  setStatus(`Building one file from ${count} files (${fmt(totalBytes)}). Keep the screen on.`);
  try {
    const zip = await buildZip(ARCHIVE, (done, all, skipped) => {
      const pct = Math.round((done / all) * 100);
      fill.style.width = pct + "%";
      setStatus(`Copying ${done} / ${all} files — ${pct}%` + (skipped ? ` (${skipped} skipped)` : ""));
    }, onlyAssets);
    fill.style.width = "100%";
    const url = URL.createObjectURL(zip);

    // No automatic click. A blocked programmatic download can swallow the
    // next real tap too, so the user's own tap is the only trigger.
    LAST_ZIP = zip;
    const fin = $("savefinal");
    fin.href = url;
    fin.download = "extracted-files.zip";
    fin.textContent = `Tap here to save  ${(zip.size / 1048576).toFixed(1)} MB`;
    fin.style.display = "block";
    $("saveshare").style.display = "block";

    setTimeout(() => URL.revokeObjectURL(url), 1800000);
    setStatus(`Ready — ${(zip.size / 1048576).toFixed(1)} MB. Tap the green button to save it.`, "ok");
  } catch (err) {
    setStatus("Could not pack: " + err.message, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = "Download everything (one .zip file)";
    setTimeout(() => bar.classList.remove("on"), 4000);
  }
});
</script>
</body>
</html>
