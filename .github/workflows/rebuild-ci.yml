name: Rebuild branch validation

on:
  push:
    branches:
      - "rebuild/**"
  pull_request:
    branches: [main]
    paths:
      - "godot_project/**"
      - "tools/generate_levels.py"
      - "tools/validate_levels.py"
      - ".github/workflows/rebuild-ci.yml"

permissions:
  contents: read

concurrency:
  group: rebuild-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the tested branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate 600 campaign data records
        run: python3 tools/generate_levels.py

      - name: Validate 600 campaign data records
        run: python3 tools/validate_levels.py

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2-stable"
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project and detect GDScript errors
        run: godot --headless --path godot_project --editor --quit

      - name: Run grid and gameplay tests
        run: godot --headless --path godot_project --script res://tests/test_gameplay.gd


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36 and build tools
        run: |
          set -euo pipefail
          sdkmanager --licenses < <(yes)
          sdkmanager "platform-tools" "cmdline-tools;latest" "platforms;android-36" "build-tools;36.1.0" "ndk;28.1.13356709" "cmake;3.10.2.4988404"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Install matching Godot Android export templates
        run: |
          set -euo pipefail
          VERSION="4.7.2-stable"
          curl -fL --retry 3 -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          if [ -f /tmp/godot-templates/version.txt ]; then
            cp /tmp/godot-templates/version.txt "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          fi
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create temporary debug signing key
        run: |
          set -euo pipefail
          mkdir -p godot_project/build out
          keytool -genkeypair -noprompt -v \
            -keystore godot_project/build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot Android build template and export debug APK
        run: |
          set -euo pipefail
          godot --headless --path godot_project --install-android-build-template
          godot --headless --path godot_project --export-debug "Android APK" "$GITHUB_WORKSPACE/out/BubbleShooterClassicBlast-debug.apk"
          test -s "$GITHUB_WORKSPACE/out/BubbleShooterClassicBlast-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/out/BubbleShooterClassicBlast-debug.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleShooterClassicBlast-rebuild-debug-apk
          path: out/BubbleShooterClassicBlast-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated campaign validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-600-level-validation
          path: |
            godot_project/levels/index.json
          if-no-files-found: warn
          retention-days: 14
