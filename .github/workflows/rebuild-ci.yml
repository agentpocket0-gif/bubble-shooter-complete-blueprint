name: Rebuild branch validation

on:
  push:
    branches:
      - "rebuild/**"
  pull_request:
    branches: [main]
    paths:
      - "godot_project/**"
      - "tools/generate_levels.py"
      - "tools/validate_levels.py"
      - ".github/workflows/rebuild-ci.yml"

permissions:
  contents: read

concurrency:
  group: rebuild-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the tested branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate 600 campaign data records
        run: python3 tools/generate_levels.py

      - name: Validate 600 campaign data records
        run: python3 tools/validate_levels.py

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2-stable"
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project and detect GDScript errors
        run: godot --headless --path godot_project --editor --quit

      - name: Run grid and gameplay tests
        run: godot --headless --path godot_project --script res://tests/test_gameplay.gd

      - name: Upload generated campaign validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-600-level-validation
          path: |
            godot_project/levels/index.json
          if-no-files-found: warn
          retention-days: 14
